const L1=`You only like me when I'm pretty.
You only like me when you're drunk.
So where do I stand?

I always tell you to stop playing with my feelings.
You were so sweet when you're drunk, but too sour when you're sober.
You act jealous whenever I talk about someone, yet when I confront you, I always receive the same words—"wala akong pake."

How can you be so sweet and cruel at the same time?
How can you make me feel so liked, only to deny it the next day?
How can you be so playful with my feelings?

If you're asking why I still like you despite every bad trait you show, I would probably answer, "I don't know."
Because even though I know that I have to stop, a part of me wouldn't even budge.

Peculiar, isn't it?

But to be honest, I'm getting tired of this.
I'm getting tired of telling myself that I should stop, yet still silently waiting for you.
I'm getting tired of hearing the words, "You already know where you stand, so why are you still doing this?" knowing that I crave more than that.

I'm getting tired of everything…

And so tonight, after seeing and realizing that you don't really care about me, I have decided to end my feelings for you.

Ending my feelings for someone I've liked for months really hurts, but staying in something that isn't real would cost me more.

Liking you was one of the things that happened to me this year.
I was able to like someone I never expected to like.
I was able to accept the fact that feelings don't always have to be reciprocated.
I was able to see the beauty in liking someone.

I hope it really ends here.
Because I don't want to be confused until the end of the year.
I want clarity, not charity for what you can only give.
I want love, not a love bomb.

And before we stopped talking, there was that time when you became my genie and asked me to make three wishes.

My first wish was for you to be nicer to me.
My second wish was for you to stop picking fights with me.
And lastly, I wished for you to give me the peace of mind that I needed.

I didn't know that, in order for you to fulfill those wishes, you would have to stop talking to me.

Ironic, isn't it?

I wished for you to be nicer to me, and maybe the only way you could do that was by no longer giving me reasons to get hurt.

I wished for you to stop picking fights with me, and maybe the only way for there to be no more fights was for us to stop talking.

And I wished for peace of mind, not knowing that maybe the only way I could finally have it was by letting you go.

Maybe I just didn't understand what my own wishes meant at the time.

I wanted you to change the way you treated me, but maybe what I really needed was to stop waiting for you to treat me differently.

I don't want to keep holding on to the sweet version of you that only appears sometimes.
I don't want to keep waiting for you to say things when you're drunk that you would never say when you're sober.

Because every time you make me feel wanted, I start hoping again.
And every time you deny it, I'm the one left trying to convince myself that it meant nothing.

I'm tired of that cycle.

Maybe you don't realize how much your actions affect me.
Maybe you don't mean to confuse me.
Maybe, to you, some things are just jokes, random moments, or things you do without thinking.

But to me, they mean something.

And I don't want to keep pretending that they don't.

I don't want to beg you to care about me.
I don't want to force you to feel something you don't feel.
And I don't want to keep waiting for an answer that you've already given me in your own way.

Maybe this is what letting go is supposed to feel like.

Not suddenly forgetting someone.
Not waking up one day and realizing that you don't care anymore.

Maybe it's simply choosing to stop waiting.

So if this is where I finally stop liking you, then I hope I have the strength to stay away from the things that make me fall for you again.

I hope I stop looking for signs.
I hope I stop giving meaning to every little thing you do.
I hope I stop waiting for you to look for me.
I hope I stop wondering if you miss me when I'm gone.

Because I don't want to spend another month wondering where I stand.

I liked you.
I really did.

And maybe a part of me will still like you for a while.

But I don't want that part of me to keep hurting the rest of me.

So this time, I'm choosing myself.

Not because I suddenly stopped caring, but because I'm finally tired of caring about someone who makes me feel like caring is something I should be ashamed of.

I don't regret liking you.

I don't regret the moments when you made me happy.
I don't regret the times when I felt special because of you.

I just wish I didn't have to keep questioning whether those moments meant anything to you.

Maybe someday, I'll look back at all of this and realize that letting you go was the right thing to do.

And maybe someday, I'll finally understand why I had to meet someone who taught me that not every feeling is meant to become a relationship.

For now, I just want peace.

I want clarity.

I want to stop wondering.

I want to stop hoping.

And most importantly, I want to stop hurting myself by staying somewhere I already know I don't belong.

So if you really don't care, then I'll accept it.

And if you do care, but not in the way I want you to, I'll accept that too.

I just can't keep living in between those two possibilities.

I want clarity, not charity for what you can only give.

I want love, not a love bomb.

And this time, I want to choose myself enough to finally let you go.`;
const L2=`To the person who taught me something,

I thought for a long time that I was losing something. Now I understand that I was learning something.

I realized that I don't have to be someone's favorite to be worth choosing. I realized that being liked only in certain moments is not the same as being cared for. And I realized that waiting for someone to change isn't love. Sometimes it's just fear of letting go.

I also realized that I was never too much. I just kept offering my heart to someone who wasn't ready to hold it.

But I'm not bitter. I'm grateful.

Thank you for the moments that made me smile, even if they didn't last.
Thank you for showing me that I can like someone with my whole heart.
Thank you for helping me see what I want, and what I will never settle for again.
And thank you for being the reason I finally learned to choose myself.`;

const o=document.createElement('div');o.className='ov';const s=document.createElement('div');s.className='sheet '+cls;if(deco)s.innerHTML=deco;
txt.trim().split('\n\n').forEach(p=>{const d=document.createElement('div');d.className='p';p.split('\n').forEach(l=>{const e=document.createElement('span');e.className='l';e.textContent=l;e.style.cssText=`transform:rotate(${((Math.random()-.5)*.8).toFixed(2)}deg) translateX(${(Math.random()*4).toFixed(1)}px);opacity:${(.84+Math.random()*.16).toFixed(2)};letter-spacing:${(Math.random()*.4).toFixed(2)}px`;d.appendChild(e)});s.appendChild(d)});
const b=document.createElement('button');b.className='hw';b.textContent=btn;s.appendChild(b);o.appendChild(s);document.body.appendChild(o);
const ps=[...s.querySelectorAll('.p')];
const chk=()=>ps.forEach(p=>{if(!p.classList.contains('on')&&(rm||p.getBoundingClientRect().top<innerHeight*.92))p.classList.add('on')});
chk();const iv=setInterval(()=>{if(!o.isConnected)return clearInterval(iv);chk()},250);o.addEventListener('scroll',chk);
requestAnimationFrame(()=>o.classList.add('show'));
b.onclick=()=>{o.classList.add('out');setTimeout(()=>{o.remove();done()},900)}}
function openL1(){letter(L1,'','let it go',()=>setTimeout(rebirth,2000))}

/* ===== Rebirth ===== */
const TINTS=[[1,.97,.97],[1,.85,.9],[.97,.62,.78],[1,.9,.92],[.9,.5,.72],[1,.78,.85],[.95,.7,.82],[1,.92,.95],[.88,.45,.68],[1,.8,.88]];
let rb=null,bq=[],wrap=null;const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function noiseTex(c1,fib){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,128,128);for(let i=0;i<260;i++){x.strokeStyle=`rgba(${fib},${Math.random()*.2})`;x.beginPath();const a=Math.random()*128,b=Math.random()*128;x.moveTo(a,b);x.lineTo(a+Math.random()*14-7,b+Math.random()*14-7);x.stroke()}return new THREE.CanvasTexture(c)}
function cone(rt,rb2,h,cy,mat,cr,ph){const g=new THREE.CylinderGeometry(rt,rb2,h,64,14,true),p=g.attributes.position;
for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),y=p.getY(i),a=Math.atan2(z,x),k=1+cr*Math.sin(a*7+y*2.5+ph)+cr*.6*Math.sin(a*13-y*4);p.setXYZ(i,x*k,y,z*k)}
g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.position.y=cy;return m}
function buildWrap(){const w=new THREE.Group();w.position.y=GB;
const kraft=new THREE.MeshStandardMaterial({map:noiseTex('#b98c5a','110,70,30'),side:2,roughness:.95,transparent:true,opacity:0}),
tis=new THREE.MeshStandardMaterial({color:0xffb9d0,side:2,roughness:.9,transparent:true,opacity:0,depthWrite:false}),
rib=new THREE.MeshStandardMaterial({color:0xd23a76,roughness:.25,metalness:.15,side:2,transparent:true,opacity:0});
w.add(cone(1.3,.22,2.1,1.0,kraft,.035,0));w.add(cone(1.65,.3,2.4,1.25,tis,.07,1.3));
const ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.05,8,48),rib);ring.rotation.x=Math.PI/2;ring.position.y=.95;w.add(ring);
[-1,1].forEach(s=>{const lp=new THREE.Mesh(new THREE.TorusGeometry(.2,.045,8,24),rib);lp.scale.set(1.3,1,.5);lp.position.set(s*.24,.95,.76);lp.rotation.z=s*.45;w.add(lp);
const tg=new THREE.PlaneGeometry(.12,.85,1,8),pp=tg.attributes.position;for(let i=0;i<pp.count;i++)pp.setX(i,pp.getX(i)+Math.sin(pp.getY(i)*3)*.05);tg.computeVertexNormals();
const t=new THREE.Mesh(tg,rib);t.position.set(s*.1,.5,.78);t.rotation.set(-.15,0,s*.18);w.add(t)});
const kn=new THREE.Mesh(new THREE.SphereGeometry(.08,12,12),rib);kn.position.set(0,.95,.78);w.add(kn);
w.userData.mats=[kraft,tis,rib];return w}
function rebirth(){rb={t0:performance.now()/1000};$('bg2').style.opacity=0;
TINTS.forEach((t,i)=>{const o=tulip(t,0);const a=(i-4.5)*.11;o.g.rotation.set((i%2?.2:-.15)+((i*13)%5-2)*.03,(i*2.1)%6,-a);o.g.userData.s=.78+.22*((i*7)%5)/4;o.g.userData.d=1.6+((i*37)%10)*.28;o.g.visible=false;sc.add(o.g);bq.push(o)})}
function rebirthTick(t){stemM.emissive.setRGB(.5,.2,.3).multiplyScalar(ease(t/1.5));back.intensity=1.2+2*ease(t/1.5);
if(t>1.6&&hero.g.parent){sc.remove(hero.g);stemM.emissive.setRGB(0,0,0);$('bg2').style.opacity=1}
bq.forEach(o=>{const u=(t-o.g.userData.d)/3;o.g.visible=u>0;if(u>0){const g=ease(u),s=o.g.userData.s;o.g.scale.set(s,s*Math.max(.01,g),s);o.h.scale.setScalar(.3+.7*ease((u-.3)/.7));o.setOpen(ease((u-.55)/.45))}});
if(t>6&&!wrap){wrap=buildWrap();sc.add(wrap)}
if(wrap){const a=ease((t-6)/2.5);wrap.userData.mats.forEach(m=>m.opacity=m===wrap.userData.mats[1]?a*.55:a)}
if(t>11&&!rb.env){rb.env=1;showEnv()}}

/* ===== Envelope ===== */
function showEnv(){const e=document.createElement('div');e.id='env';e.innerHTML='<div class="bk"></div><div class="pp"></div><div class="fr"></div><div class="fl"></div><div class="sl">🌷</div>';
const h=document.createElement('div');h.id='eh';h.textContent='open it';document.body.append(e,h);
requestAnimationFrame(()=>{e.classList.add('on');h.classList.add('on')});let used=0;
e.onclick=()=>{if(used)return;used=1;h.classList.remove('on');if(navigator.vibrate)navigator.vibrate(20);e.classList.add('crack');
setTimeout(()=>e.classList.add('open'),500);
setTimeout(()=>letter(L2,'lav','close',()=>{e.style.opacity=0;setTimeout(()=>{e.remove();h.remove()},1500);finale()},'<i>🌷</i>'),2200)}}

/* ===== Scene 4: tara na codm ===== */
function finale(){const d=document.createElement('div');d.id='dim';
d.innerHTML='<div class="card" id="cd"><div class="tara">tara na codm</div><div id="pn"></div><div class="bt"><button id="G">G</button><button id="P">Pass</button></div></div>';document.body.appendChild(d);
requestAnimationFrame(()=>d.classList.add('on'));
const PM=["bawal ganern.","tara na kasi.","isang game lang, promise.","sige na please.","wag ka na mahiya, tara na.","hindi pwede yan.","G na yan."],G=$('G'),P=$('P'),pn=$('pn'),cd=$('cd');let n=0,gs=1,ps=1,gone=0;
P.onclick=e=>{e.stopPropagation();if(n>=7)return;pn.textContent=PM[n];pn.classList.remove('pop');void pn.offsetWidth;pn.classList.add('pop');n++;ps*=.77;gs*=1.28;
cd.style.setProperty('--ps',ps);cd.style.setProperty('--gs',gs);G.classList.add('hot');P.classList.remove('wob');void P.offsetWidth;P.classList.add('wob');
if(navigator.vibrate)navigator.vibrate(25);if(n>=7){P.style.pointerEvents='none';P.style.visibility='hidden'}};
const go=()=>{if(gone)return;gone=1;d.classList.add('off');setTimeout(()=>{d.remove();ending()},800)};
G.onclick=e=>{e.stopPropagation();go()};d.onclick=()=>{if(n>=7)go()}}
function ending(){for(let i=0;i<55;i++){const s=document.createElement('span');s.className='pt'+(i%4==0?' s':'');s.style.cssText=`left:${Math.random()*100}vw;--d:${5+Math.random()*5}s;--dx:${(Math.random()-.5)*160}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*3}s`;document.body.appendChild(s)}
const e=document.createElement('div');e.id='end';e.innerHTML='<div class="t">on ka na, inv mo me</div><button>replay</button>';document.body.appendChild(e);
requestAnimationFrame(()=>e.classList.add('on'));const b=e.querySelector('button');setTimeout(()=>b.style.opacity=1,3200);b.onclick=()=>location.reload()}

/* ===== Render loop ===== */
let last=performance.now()/1000;
function loop(){const T=performance.now()/1000,dt=Math.min(.05,T-last);last=T;
if(!rm&&hero.g.parent){hero.g.rotation.z=Math.sin(T*.8)*.02;hero.h.rotation.z=Math.sin(T*.9+1)*.03;hero.h.rotation.x=Math.sin(T*.7)*.02}
falls.forEach(f=>{f.t+=dt;const m=f.m;
if(!f.land){m.position.y-=dt*f.sp*(.9+.4*Math.sin(f.t*2.1+f.ph));m.position.x+=Math.sin(f.t*1.6+f.ph)*dt*.9*f.sp;m.position.z+=Math.cos(f.t*1.2+f.ph)*dt*.3*f.sp;
m.rotation.x+=dt*(.9+Math.sin(f.t*1.3))*f.sp;m.rotation.y+=dt*1.1*f.sp;m.rotation.z+=dt*1.4*Math.sin(f.t*1.9+f.ph)*f.sp;
if(m.position.y<=GY){f.land=1;f.lt=0;m.position.y=GY;f.q=new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.45,Math.random()*6.28,0))}}
else{f.lt+=dt;m.quaternion.slerp(f.q,Math.min(1,dt*2.5));const a=Math.min(1,f.lt/5);m.material.color.copy(f.c0).lerp(FADE,a);m.material.opacity=1-.35*a;if(f.cb&&f.lt>.9){const c=f.cb;f.cb=null;c()}}});
if(rb)rebirthTick(T-rb.t0);
const p=dg.attributes.position;for(let i=0;i<N;i++){let y=p.getY(i)+(rb?-dv[i]*.5:dv[i]*.3)*dt;if(y>4)y=-4;if(y<-4)y=4;p.setY(i,y);p.setX(i,p.getX(i)+Math.sin(T+i)*dt*.1)}p.needsUpdate=true;
if(rb)dm.color.setHex(0xffe0a0);
rd.render(sc,cam);requestAnimationFrame(loop)}
loop();
</script></body></html>
